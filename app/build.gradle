plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.sweeper.unrepost'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.sweeper.unrepost'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // Fixed key so each new build installs over the previous one.
    signingConfigs {
        sweeper {
            storeFile file('sweeper.keystore')
            storePassword 'sweeper123'
            keyAlias 'sweeper'
            keyPassword 'sweeper123'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.sweeper }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
