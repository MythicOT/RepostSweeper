name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk RepostSweeper.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RepostSweeper-apk
          path: RepostSweeper.apk
      - name: Publish as a direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest RepostSweeper.apk --title "Repost Sweeper" --notes "Tap RepostSweeper.apk to download, then open it to install." --latest
